<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <section class="uib">
            <svg
                class="uib-svg"
                viewBox="0 0 920 540"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <!-- ── Browser window ── -->
                <rect
                    x="148"
                    y="88"
                    width="620"
                    height="412"
                    rx="14"
                    fill="white"
                    stroke="#111"
                    stroke-width="4"
                />
                <path
                    d="M148,154 L148,102 Q148,88 162,88 L756,88 Q768,88 768,102 L768,154 Z"
                    fill="#111"
                />
                <circle cx="185" cy="121" r="9" fill="white" />
                <circle cx="213" cy="121" r="9" fill="white" />
                <circle cx="241" cy="121" r="9" fill="white" />

                <!-- ── Blue panel ── -->
                <rect x="172" y="168" width="228" height="190" fill="#2BA7E8" />

                <!-- ── Mountains image ── -->
                <rect
                    x="296"
                    y="220"
                    width="360"
                    height="238"
                    fill="white"
                    stroke="#111"
                    stroke-width="4"
                />
                <polygon points="296,458 360,308 429,458" fill="#111" />
                <polygon points="357,458 465,264 548,458" fill="#111" />
                <polygon points="482,458 574,322 656,458" fill="#111" />
                <circle cx="483" cy="259" r="30" fill="#E8394A" />

                <!-- ── Color swatches ── -->
                <rect
                    x="46"
                    y="444"
                    width="208"
                    height="56"
                    rx="28"
                    fill="white"
                    stroke="#111"
                    stroke-width="4"
                />
                <rect
                    x="70"
                    y="460"
                    width="44"
                    height="26"
                    rx="3"
                    fill="#2BA7E8"
                />
                <rect
                    x="126"
                    y="460"
                    width="44"
                    height="26"
                    rx="3"
                    fill="#E8394A"
                />
                <rect
                    x="182"
                    y="460"
                    width="44"
                    height="26"
                    rx="3"
                    fill="#111"
                />

                <!-- ── Red dashed selection ── -->
                <rect
                    x="140"
                    y="150"
                    width="274"
                    height="228"
                    rx="4"
                    fill="none"
                    stroke="#E8394A"
                    stroke-width="3.5"
                    stroke-dasharray="14 8"
                />

                <!-- ── Plus icon ── -->
                <line
                    x1="128"
                    y1="406"
                    x2="152"
                    y2="406"
                    stroke="#111"
                    stroke-width="4"
                    stroke-linecap="round"
                />
                <line
                    x1="140"
                    y1="394"
                    x2="140"
                    y2="418"
                    stroke="#111"
                    stroke-width="4"
                    stroke-linecap="round"
                />

                <!-- ── Blue selection bounding box (sub bulă) ── -->
                <line
                    x1="479"
                    y1="55"
                    x2="820"
                    y2="55"
                    stroke="#2BA7E8"
                    stroke-width="2.5"
                />
                <line
                    x1="820"
                    y1="55"
                    x2="820"
                    y2="445"
                    stroke="#2BA7E8"
                    stroke-width="2.5"
                />
                <rect x="472" y="48" width="14" height="14" fill="#2BA7E8" />
                <rect x="813" y="48" width="14" height="14" fill="#2BA7E8" />
                <rect x="813" y="438" width="14" height="14" fill="#2BA7E8" />

                <!-- ── Chat bubble ── -->
                <!-- Tail drawn first, covered by bubble rect -->
                <polygon
                    points="696,272 674,302 730,272"
                    fill="white"
                    stroke="#111"
                    stroke-width="4"
                    stroke-linejoin="round"
                />
                <!-- Bubble rect (covers tail top edge) -->
                <rect
                    x="668"
                    y="162"
                    width="214"
                    height="112"
                    rx="14"
                    fill="white"
                    stroke="#111"
                    stroke-width="4"
                />
                <!-- White strip covers the join between tail and bubble -->
                <line
                    x1="698"
                    y1="272"
                    x2="728"
                    y2="272"
                    stroke="white"
                    stroke-width="9"
                />
                <!-- Text lines inside bubble -->
                <line
                    x1="694"
                    y1="204"
                    x2="861"
                    y2="204"
                    stroke="#111"
                    stroke-width="6"
                    stroke-linecap="round"
                />
                <line
                    x1="694"
                    y1="232"
                    x2="836"
                    y2="232"
                    stroke="#111"
                    stroke-width="6"
                    stroke-linecap="round"
                />

                <!-- ── Cursor ── -->
                <path
                    d="M814,450 L814,473 L821,467 L827,479 L832,477 L826,465 L836,465 Z"
                    fill="white"
                    stroke="#111"
                    stroke-width="3"
                    stroke-linejoin="round"
                />
            </svg>
        </section>
    </body>
</html>
